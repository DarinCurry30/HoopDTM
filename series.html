.series-team-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
}

.series-team {
    min-width: 90px;
    padding: 20px;
    background: #0c0c0e;
    border: 1px solid #2d2d35;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 900;
    text-align: center;
}
.series-team {
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.series-team:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 14px rgba(232, 117, 0, 0.7);
            border: 1px solid #bd8723
}
.series-seed {
    width: 55px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0c0c0e;
    border: 1px solid #2d2d35;
    border-radius: 5px;

    color: #ffffff;
    font-size: 24px;
    font-weight: 900;
}
.series-seed:hover{
    box-shadow: 0 0 14px rgba(232, 117, 0, 0.7);
}
.back-to-playoffs {
    display: block;
    width: fit-content;
    margin: 25px auto 0;
    padding: 10px 18px;
    background: #15151b;
    border: 1px solid #2d2d35;

    color: #ffffff;

}

.back-to-playoffs:hover {
    border-color: #ff7a00;
    transform: translateY(-2px);
}
.games-section {
    max-width: 1100px;
    margin: 40px auto 0;
    padding: 0 10px;
    box-sizing: border-box;
    overflow-x: clip;
}

.games-section h2 {
    margin-bottom: 15px;
    font-size: 22px;
    font-weight: 900;
}

.games-section table {
    width: calc(100% - 20px);
    margin: 0 10px;
    table-layout: auto;
}

.games-section table th,
.games-section table td {
    white-space: nowrap;
    text-align: center;
}

.games-section table th:nth-child(1),
.games-section table td:nth-child(1) {
    width: 80px;
}

.games-section table th:nth-child(2),
.games-section table td:nth-child(2) {
    width: 80px;
}

.games-section table th:nth-child(3),
.games-section table td:nth-child(3) {
    width: 100px;
}

.games-section table th:nth-child(4),
.games-section table td:nth-child(4) {
    width: 1%;
    padding-left: 25px;
    padding-right: 25px;
}

.games-section table th:nth-child(5),
.games-section table td:nth-child(5),
.games-section table th:nth-child(6),
.games-section table td:nth-child(6),
.games-section table th:nth-child(7),
.games-section table td:nth-child(7) {
    width: 45px;
}

.series-result {
    max-width: 1100px;
    margin: 35px auto 0;
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
}

.series-result .result-team {
    color: #ff7a00;
}
.featured-player {
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    transition: color 0.3s ease;
}

.featured-player:hover {
    color: #ff7a00;
}
.featured-team {
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    transition: color 0.3s ease;
}

.featured-team:hover {
    color: #ff7a00;
}
.result-team {
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;

    transition: transform 0.3s ease, color 0.3s ease;
}

.result-team:hover {
    color: #ff7a00;
    transform: translateY(-2px);
}
.games-section tbody tr {
    cursor: default;
    transition: transform 0.2s ease;
}

.games-section tbody tr:hover {
    transform: translateX(5px);
}

/* NBA FINALS SPECIAL DESIGN */
body.finals-mode .series-header h1 {
    font-size: clamp(38px, 6vw, 68px);
    font-weight: 1000;
    letter-spacing: -2px;
    text-transform: uppercase;
}

body.finals-mode .series-header p {
    color: #bd8723;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
}

body.finals-mode .series-matchup {
    border-color: #bd8723;
    background: linear-gradient(145deg, #191714, #0b0b0f 70%);
}

body.finals-mode .series-team {
    font-size: 26px;
    border-color: #bd8723;
}

.finals-games {
    max-width: 1050px;
    margin: 55px auto 30px;
    padding: 0 16px;
}

.finals-games h2 {
    text-align: center;
    font-size: 30px;
    font-weight: 1000;
    letter-spacing: 2px;
    margin-bottom: 28px;
}

.finals-game-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
}

.finals-game-card {
    aspect-ratio: 1 / 1;
    min-height: 0;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #bd8723;
    border-radius: 12px;
    background: #15151b;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
}

.finals-game-card:hover:not(:disabled) {
    transform: translateY(-4px);
    background: #211d15;
}

.finals-game-card:disabled {
    cursor: default;
    opacity: .65;
}

.finals-game-label {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
}

.finals-game-circle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px solid #bd8723;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 1000;
}

.finals-game-card.is-played .finals-game-circle {
    background: #bd8723;
    color: #0b0b0f;
}

.finals-game-card.is-unplayed .finals-game-circle {
    color: #888;
    border-color: #555;
}

.finals-game-card:nth-child(5) {
    grid-column: 1;
    grid-row: 2;
    transform: none;
}

.finals-game-card:nth-child(6) {
    grid-column: 2;
    grid-row: 2;
}

.finals-game-card:nth-child(7) {
    grid-column: 3;
    grid-row: 2;
}

/* Center the bottom three cards together */
.finals-game-card:nth-child(n+5) {
    position: relative;
    left: 50%;
}

@media (max-width: 650px) {
    .finals-game-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .finals-game-card:nth-child(n) {
        grid-column: auto;
    }

    .finals-game-card:nth-child(7) {
        grid-column: 1 / -1;
        width: calc(50% - 9px);
        justify-self: center;
    }
}

<script>
    const teamSlugs = {
        BOS: "boston-celtics",
        MIA: "miami-heat",
        NY: "new-york-knicks",
        NYK: "new-york-knicks",

        LAL: "los-angeles-lakers",
        MEM: "memphis-grizzlies",
        SAS: "san-antonio-spurs",
        SA: "san-antonio-spurs",
        MIN: "minnesota-timberwolves",
        HOU: "houston-rockets",
        LAC: "los-angeles-clippers",
        MIL: "milwaukee-bucks",
        PHI: "philadelphia-76ers",
        IND: "indiana-pacers",
        ORL: "orlando-magic",
        GS: "golden-state-warriors",
        GSW: "golden-state-warriors",
        SAC: "sacramento-kings",
        NO: "new-orleans-pelicans",
        PHX: "phoenix-suns",
        POR: "portland-trail-blazers",
        ATL: "atlanta-hawks",
        TOR: "toronto-raptors",
        DAL: "dallas-mavericks",
        UTA: "utah-jazz",
        BKN: "brooklyn-nets",
        CHI: "chicago-bulls"
    };

    const params = new URLSearchParams(window.location.search);

    const season = params.get("season");
    const round = params.get("round");
    const conference = params.get("conference");
    const seriesIndex = Number(params.get("series"));

    const seed1 = document.getElementById("seed1");
    const seed2 = document.getElementById("seed2");
    const seriesTitle = document.getElementById("series-title");
    const seriesRound = document.getElementById("series-round");
    const team1 = document.getElementById("team1");
    const team2 = document.getElementById("team2");
    const gamesTableBody = document.getElementById("games-table-body");
    const seriesResult = document.getElementById("series-result");

    const seasonData = playoffData[season];

    let matchupData = null;

    if (seasonData) {
        if (round === "finals") {
            matchupData = seasonData.finals;
        } else if (conference === "west") {
            matchupData = seasonData.west?.[round]?.[seriesIndex];
        } else if (conference === "east") {
            matchupData = seasonData.east?.[round]?.[seriesIndex];
        }
    }

    seriesTitle.textContent = season
        ? `${season} NBA Playoffs`
        : "NBA Playoffs";

    let roundName = "Series";

    if (round === "firstRound") {
        roundName = "First Round";
    } else if (round === "semifinals") {
        roundName = "Conference Semifinals";
    } else if (round === "conferenceFinals") {
        roundName = "Conference Finals";
    } else if (round === "finals") {
        roundName = "NBA Finals";
    }

    let team1Code = "";
    let team2Code = "";

    /* MATCHUP */

    if (matchupData) {

        const team1Parts = matchupData.team1.split(" ");
        const team2Parts = matchupData.team2.split(" ");

        team1Code = team1Parts[0];
        team2Code = team2Parts[0];

        const team1Seed = team1Parts[1];
        const team2Seed = team2Parts[1];

        team1.textContent = team1Code;
        team2.textContent = team2Code;

        seed1.textContent = team1Seed || "-";
        seed2.textContent = team2Seed || "-";

        if (teamSlugs[team1Code]) {
            team1.onclick = function () {
                window.location.href =
                    `team.html?team=${teamSlugs[team1Code]}`;
            };
        }

        if (teamSlugs[team2Code]) {
            team2.onclick = function () {
                window.location.href =
                    `team.html?team=${teamSlugs[team2Code]}`;
            };
        }

        const conferenceName =
            conference === "west" ? "West" :
            conference === "east" ? "East" :
            "";

        seriesRound.textContent =
            `${conferenceName} ${roundName} ${team1Code} vs. ${team2Code}`;

    } else {

        team1.textContent = "TBD";
        team2.textContent = "TBD";

        seed1.textContent = "-";
        seed2.textContent = "-";

        seriesRound.textContent = roundName;
    }


    /* GAME DATA */

    const gameSeries =
        round === "finals"
            ? seriesData?.[season]?.finals
            : seriesData?.[season]?.[conference]?.[round]?.[seriesIndex];


    /* SERIES RESULT */

    if (
        gameSeries &&
        gameSeries.games &&
        gameSeries.games.length > 0 &&
        matchupData
    ) {

const wins = {};

gameSeries.games.forEach(game => {
    wins[game.winner] =
        (wins[game.winner] || 0) + 1;
});

const team1Wins = wins[team1Code] || 0;
const team2Wins = wins[team2Code] || 0;

let nextRound = "";

if (round === "firstRound") {
    nextRound = "moves on to Conference Semifinals";
} else if (round === "semifinals") {
    nextRound = "moves on to Conference Finals";
} else if (round === "conferenceFinals") {
    nextRound = "moves on to the NBA Finals";
} else if (round === "finals") {
    nextRound = "wins the NBA Championship";
}

if (team1Wins > team2Wins) {

    seriesResult.innerHTML =
        `<a href="team.html?team=${teamSlugs[team1Code]}" class="result-team">
            ${team1Code}
        </a> wins ${team1Wins}-${team2Wins}, ${nextRound}`;

} else if (team2Wins > team1Wins) {

    seriesResult.innerHTML =
        `<a href="team.html?team=${teamSlugs[team2Code]}" class="result-team">
            ${team2Code}
        </a> wins ${team2Wins}-${team1Wins}, ${nextRound}`;
}
    }


    /* GAMES TABLE */

    if (
        gameSeries &&
        gameSeries.games &&
        gamesTableBody
    ) {

        gameSeries.games.forEach(game => {

            const row = document.createElement("tr");

            const playerSlug = game.player
                .toLowerCase()
                .replace(/'/g, "")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-|-$/g, "");

            row.innerHTML = `
                <td>Game ${game.game}</td>

                <td>
    <a
        href="team.html?team=${teamSlugs[game.winner]}"
        class="featured-team"
    >
        ${game.winner}
    </a>
</td>

                <td>${game.score}</td>

                <td>
                    <a
                        href="player.html?player=${playerSlug}"
                        class="featured-player"
                    >
                        ${game.player}
                    </a>
                </td>

                <td>${game.pts}</td>

                <td>${game.reb}</td>

                <td>${game.ast}</td>
            `;

            gamesTableBody.appendChild(row);
        });
    }
document.addEventListener("DOMContentLoaded", () => {
    const loadingScreen = document.getElementById("series-loading-screen");
    const progressBar = document.querySelector(".loading-bar-fill");

    if (!loadingScreen || !progressBar) return;

    let loadingTimer;
    let progressFrame;
    let navigationStarted = false;

    function startLoading(onComplete) {
        clearInterval(loadingTimer);
        cancelAnimationFrame(progressFrame);

        navigationStarted = true;
        loadingScreen.classList.remove("hidden");
        progressBar.style.width = "0%";

        // Random duration between 1.5 and 3 seconds.
        const duration = 1500 + Math.random() * 1500;
        const startTime = performance.now();

        function updateProgress(now) {
            const elapsed = now - startTime;
            const progress = Math.min((elapsed / duration) * 100, 100);

            progressBar.style.width = progress + "%";

            if (progress < 100) {
                progressFrame = requestAnimationFrame(updateProgress);
            } else if (onComplete) {
                onComplete();
            }
        }

        progressFrame = requestAnimationFrame(updateProgress);
    }

    // Hide the loader after the initial page has loaded.
    window.addEventListener("load", () => {
        if (navigationStarted) return;

        startLoading(() => {
            loadingScreen.classList.add("hidden");
        });
    });

    // Show the loader when opening a series link.
    document.querySelectorAll('a[href*="series.html"]').forEach(link => {
        link.addEventListener("click", event => {
            if (
                event.ctrlKey ||
                event.metaKey ||
                event.shiftKey ||
                event.altKey ||
                event.button !== 0
            ) return;

            const url = new URL(link.href, window.location.href);

            if (url.href === window.location.href) return;

            event.preventDefault();

            startLoading(() => {
                window.location.href = url.href;
            });
        });
    });
});

/* FINALS GAME CARDS */
if (round === "finals") {
    document.body.classList.add("finals-mode");

    const finalsSection = document.getElementById("finals-games");
    const gameGrid = document.getElementById("finals-game-grid");
    const gamesSection = document.querySelector(".games-section");

    // Support the season key in the URL, with a fallback
    

const seasonKeyMap = {
    "2025-26": "2026",
    "2024-25": "2025",
    "2023-24": "2024",
    "2022-23": "2023",
    "2021-22": "2022"
};

const finalsSeason = seasonKeyMap[season] || season;

const finals = finalsData?.[String(finalsSeason)];


    if (finalsSection && gameGrid && finals) {
        finalsSection.hidden = false;

        if (gamesSection) gamesSection.hidden = true;

        gameGrid.innerHTML = "";

        
for (let gameNumber = 1; gameNumber <= 7; gameNumber++) {
    const game = finals.games?.[gameNumber];

    const played = Boolean(
        game &&
        game.played === true &&
        game.winner
    );

    const card = document.createElement("button");
    card.type = "button";

    card.className =
        `finals-game-card ${played ? "is-played" : "is-unplayed"}`;

    let scoreDisplay = "NOT PLAYED";

    if (played) {
        const homeScore = Number(game.homeScore);
        const awayScore = Number(game.awayScore);

        if (Number.isFinite(homeScore) && Number.isFinite(awayScore)) {
            const homeFirst = homeScore >= awayScore;

const firstScore = homeFirst ? homeScore : awayScore;
const secondScore = homeFirst ? awayScore : homeScore;

const firstTeam = homeFirst
    ? (game.home || game.homeTeam || game.team1 || "HOME")
    : (game.away || game.awayTeam || game.team2 || "AWAY");

const secondTeam = homeFirst
    ? (game.away || game.awayTeam || game.team2 || "AWAY")
    : (game.home || game.homeTeam || game.team1 || "HOME");

            scoreDisplay = `<strong>${firstTeam}</strong> ${firstScore} - ${secondScore} <strong>${secondTeam}</strong>`;
        } else {
            // Fallback for games that still use the old score properties
            const score1 = Number(game.team1Score);
            const score2 = Number(game.team2Score);

            if (Number.isFinite(score1) && Number.isFinite(score2)) {
                scoreDisplay =
                    `${Math.max(score1, score2)} - ${Math.min(score1, score2)}`;
            } else {
                scoreDisplay = "SCORE UNAVAILABLE";
            }
        }
    }

    card.innerHTML = `
        <span class="finals-game-label">GAME ${gameNumber}</span>
        <span class="finals-game-circle">
            ${played ? game.winner : "X"}
        </span>
        <span class="finals-game-score">
            ${scoreDisplay}
        </span>
    `;

    card.disabled = !played;

    if (played) {
        card.addEventListener("click", () => {
            const params = new URLSearchParams({
                season: season,
                game: String(gameNumber)
            });

            window.location.href =
                `finals-game.html?${params.toString()}`;
        });
    }

    gameGrid.appendChild(card);
}
} else {
        console.error("Could not render Finals boxes.", {
            round,
            season,
            finals,
            finalsSection,
            gameGrid
        });
    }
}
</script>
